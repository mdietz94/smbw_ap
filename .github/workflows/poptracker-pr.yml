name: Propose PopTracker update

# Fires on every release tag (alongside the release workflow) and can also be
# triggered manually for testing.  When the generated tracker logic differs from
# what is already in the tracker repo, this workflow opens a PR against the
# upstream SMBW_Tracker repo so the tracker stays in sync with apworld logic.
#
# Required one-time setup (repo admin):
#   1. Fork https://github.com/LuckwurstJoe/SMBW_Tracker into mdietz94/SMBW_Tracker.
#   2. Create a GitHub classic PAT (or fine-grained token) for the mdietz94 account
#      with at least `repo` scope so the workflow can push branches to the fork and
#      open cross-repo PRs against the upstream.
#   3. Add it as a repository secret named TRACKER_PAT in mdietz94/smbw_ap Settings.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Label for the PR branch (e.g. v1.2.3 or dev). Defaults to the triggering ref name.'
        required: false
        default: ''

concurrency:
  group: poptracker-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose-tracker-update:
    name: Regenerate tracker logic and open PR if changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout smbw_ap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: smbw_ap
          # vendor/Archipelago not needed; only apworld/data/* is read by the generator
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install json5
        # The generator uses json5 to tolerate trailing commas in tracker location JSON
        run: pip install json5

      - name: Checkout SMBW_Tracker fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mdietz94/SMBW_Tracker
          token: ${{ secrets.TRACKER_PAT }}
          path: SMBW_Tracker

      - name: Resolve source tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate tracker logic from apworld data
        run: |
          python smbw_ap/scripts/generate_tracker_logic.py \
            SMBW_Tracker \
            smbw_ap/apworld/smbw_archipelago/data

      - name: Detect tracker changes
        id: diff
        run: |
          cd SMBW_Tracker
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tracker logic already matches the current apworld — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tracker changes detected:"
            git diff --stat
          fi

      - name: Push branch to fork and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRACKER_PAT }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          BRANCH="ap-logic-sync-${TAG}"

          cd SMBW_Tracker
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Sync AP access logic from SMBW Archipelago ${TAG}"
          git push --force-with-lease origin "$BRANCH"

          DEFAULT_BRANCH=$(gh repo view LuckwurstJoe/SMBW_Tracker \
            --json defaultBranchRef -q .defaultBranchRef.name)

          # Idempotent: skip PR creation if one is already open for this branch.
          # gh pr list returns [] when nothing matches; .[0].number would be null
          # which is truthy in shell, so filter it out explicitly.
          EXISTING=$(gh pr list --repo LuckwurstJoe/SMBW_Tracker \
            --head "mdietz94:${BRANCH}" --state open \
            --json number --jq 'if length > 0 then (.[0].number | tostring) else "" end' \
            2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for ${BRANCH} — branch updated, no new PR."
            exit 0
          fi

          cat > /tmp/pr_body.md << EOF
          This PR was automatically generated by the [SMBW Archipelago](https://github.com/mdietz94/smbw_ap) release workflow.

          **Source release:** https://github.com/mdietz94/smbw_ap/releases/tag/$TAG

          ## What changed

          The AP item/location IDs or access logic changed in release \`$TAG\`.
          This PR regenerates the PopTracker access rules from the apworld's single source of truth
          so the tracker stays in sync.

          Files updated by \`scripts/generate_tracker_logic.py\`:
          - \`scripts/logic/smbw_generated_logic.lua\` — compiled region/location access rules (one Lua function per region, one dispatch entry per AP location ID)
          - \`items/logic_item.json\` — hidden toggle items for codes the AP logic references that have no declared item object in the tracker
          - \`locations/*.json\` — injected \`"access_rules": ["\$smbw_loc|<apid>"]\` per section (minimal diff, original formatting preserved)
          - \`scripts/init.lua\` / \`scripts/items_import.lua\` — import hooks (patched once on first run, idempotent thereafter)

          ## Review notes

          - Logic is compiled directly from \`apworld/data/{regions,locations,items}.json\` — the apworld is the single source of truth
          - Both standard linear and open-world slot options are covered
          - \`smbw_generated_logic.lua\` is auto-generated; hand edits will be overwritten on the next release
          EOF

          gh pr create \
            --repo LuckwurstJoe/SMBW_Tracker \
            --head "mdietz94:${BRANCH}" \
            --base "$DEFAULT_BRANCH" \
            --title "Sync AP access logic from SMBW Archipelago ${TAG}" \
            --body-file /tmp/pr_body.md

          echo "PR opened against LuckwurstJoe/SMBW_Tracker from mdietz94:${BRANCH}"
