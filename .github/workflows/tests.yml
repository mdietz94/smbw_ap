name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize vendor/Archipelago submodule
        # switch-mod is intentionally skipped: it's a separate (potentially
        # private) repo and isn't needed for the Python test suite.
        run: git submodule update --init --depth 1 vendor/Archipelago

      - name: Set up Python
        # Pinned to 3.11 — the wizard installs Python.Python.3.11 via winget,
        # so this is what end users actually run.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Archipelago + test dependencies
        working-directory: vendor/Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"

      - name: Run pytest
        run: pytest -n auto apworld/smbw_archipelago
