name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel an in-flight test run when a newer commit lands on the same
# branch / PR. The release workflow has its own (non-cancelling)
# concurrency group keyed on the tag.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize vendor/Archipelago submodule
        # switch-mod is intentionally skipped: it's a separate (potentially
        # private) repo and isn't needed for the Python test suite.
        run: git submodule update --init --depth 1 vendor/Archipelago

      - name: Set up Python
        # Pinned to 3.11 — the wizard installs Python.Python.3.11 via winget,
        # so this is what end users actually run.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Archipelago + test dependencies
        working-directory: vendor/Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"

      - name: Run pytest
        run: pytest -n auto apworld/smbw_archipelago
